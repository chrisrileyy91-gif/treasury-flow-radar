# Daily: update the database from official sources, check it, store it, and publish the page.
#
# The SQLite database is kept as an asset on the "database" release of this repository
# (not in git history). Each run downloads it, ingests new observations, refuses to save
# it if it is damaged or has fewer observations than before, keeps 14 dated backups,
# and publishes the static page to GitHub Pages.
name: Publish Treasury Flow Radar

# Scheduling: meridian-clock (Railway) dispatches this workflow at 18:00 New York time
# on weekdays; see schedule.json in that repo. Do not add a `schedule:` block here: the
# clock counts any run today as "already ran", so a cron run would make it skip.
# FRED posts each day's yields the following afternoon, NY Fed dealer data Thursdays
# around 16:15, CFTC data Fridays at 15:30, so an 18:00 run picks up each release.
on:
  workflow_dispatch:

permissions:
  contents: write   # update the database release asset
  pages: write      # publish to GitHub Pages
  id-token: write   # required by the Pages deployment

concurrency:
  group: publish-treasury-flow-radar
  cancel-in-progress: false   # never interrupt a run that is writing the database

env:
  DB: data/treasury_flow_radar.sqlite3
  RELEASE: database

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -e .

      - name: Download the stored database
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data
          if gh release view "$RELEASE" >/dev/null 2>&1; then
            # The release exists, so a failed download must stop the run rather than
            # start from an empty database and overwrite the stored history.
            gh release download "$RELEASE" --pattern "treasury_flow_radar.sqlite3.gz" --dir data --clobber
            gunzip -f data/treasury_flow_radar.sqlite3.gz
          else
            echo "::warning::No '$RELEASE' release yet; starting a new database."
            gh release create "$RELEASE" --title "Database" \
              --notes "SQLite database and dated backups, updated by the Publish workflow. Not a software release."
          fi
          if [ -f "$DB" ]; then
            python -m treasury_flow_radar.dbcheck --database "$DB"
            echo "BEFORE=$(python -c "import sqlite3;print(sqlite3.connect('$DB').execute('select count(*) from observations').fetchone()[0])")" >> "$GITHUB_ENV"
          else
            echo "BEFORE=0" >> "$GITHUB_ENV"
          fi

      - name: Ingest official sources
        id: ingest
        continue-on-error: true   # one failed provider should not block publishing the others
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          # Optional. SEC asks automated clients to identify themselves; set this secret to
          # "Name email@example.com" if EDGAR starts refusing the default project URL.
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          # Optional. Enables the capped (3/run) model fallback for press releases that
          # pattern matching cannot read. Without it, those releases are skipped.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m treasury_flow_radar.ingest --database "$DB" | tee ingest-report.json

      - name: Check the database before saving it
        run: python -m treasury_flow_radar.dbcheck --database "$DB" --min-observations "$BEFORE"

      - name: Save the database and a dated backup
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          stamp=$(date -u +%Y-%m-%d)
          gzip -c "$DB" > treasury_flow_radar.sqlite3.gz
          cp treasury_flow_radar.sqlite3.gz "treasury_flow_radar-$stamp.sqlite3.gz"
          cp ingest-report.json status.json 2>/dev/null || echo '{}' > status.json
          gh release upload "$RELEASE" treasury_flow_radar.sqlite3.gz "treasury_flow_radar-$stamp.sqlite3.gz" status.json --clobber
          # Keep the 14 most recent dated backups.
          gh release view "$RELEASE" --json assets -q '.assets[].name' \
            | grep -E '^treasury_flow_radar-[0-9]{4}-[0-9]{2}-[0-9]{2}\.sqlite3\.gz$' | sort -r | tail -n +15 \
            | while read -r old; do gh release delete-asset "$RELEASE" "$old" -y; done

      - name: Build the page
        run: |
          python -m dashboard.export --database "$DB" --output site/index.html
          # Publish the run's per-source ingestion report (no secrets are in it) for diagnosis.
          cp ingest-report.json site/status.json 2>/dev/null || echo '{}' > site/status.json

      - name: Run summary
        if: always()
        run: |
          {
            echo "### Treasury Flow Radar publish"
            echo "Ingestion step: ${{ steps.ingest.outcome }}"
            echo '```json'
            cat ingest-report.json 2>/dev/null || echo "{}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
