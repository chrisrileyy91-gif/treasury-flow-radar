# Temporary probe (removed before merge): run the real reader against Treasury's live pages.
name: Probe Treasury refunding pages
on:
  push:
    branches: [feat/treasury-plan-auto]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -q -e .
      - name: Dry run against live pages
        run: python -m treasury_flow_radar.sources.treasury_refunding --dry-run
